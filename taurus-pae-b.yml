# Execução Taurus isolada da sessão funcional PAE B.
# Autenticação manual pelo operador via noVNC.
# Uma iteração; não representa campanha de carga sustentada.

execution:
  - executor: selenium
    runner: pytest
    scenario: pae_b
    concurrency: 1
    iterations: 1

scenarios:
  pae_b:
    script: tests/functional/parallel/test_sessao_pae_b.py

reporting:
  - module: console
  - module: final-stats
    summary: true
    percentiles: true
