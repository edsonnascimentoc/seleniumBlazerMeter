name: Python Validation and Test Collection

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 selenium==4.48.0 flake8

      - name: Compile Python test
        run: |
          python -m py_compile test_esxi.py

      - name: Validate Python code
        run: |
          python -m flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Validate shell scripts
        run: |
          bash -n check_poc_environment.sh run_pipeline.sh

      - name: Collect pytest tests without executing integration
        run: |
          python -m pytest --collect-only -q test_esxi.py
